[audio]
enable_overdrive = true

[bar]
order = [ "Main" ]

    [bar.Main]
    background_opacity = 0.74999998323619366
    center = [ "taskbar", "bluetooth" ]
    end = [ "tray", "network", "battery", "ram", "volume" ]
    layer = "overlay"
    margin_ends = 0
    padding = 80
    radius = 0
    reserve_space = false
    scale = 0.80000000447034836
    smart_auto_hide = true
    start = [ "clock", "spacer_", "cpu", "temp" ]
    thickness = 12
    widget_spacing = 12

        [bar.Main.dead_zone.actions]
        scroll_down = "exec niri msg action focus-column-right"
        scroll_up = "exec niri msg action focus-column-left"

        [bar.Main.monitor.DP-1]
        reserve_space = true
        smart_auto_hide = false

[battery]
warning_threshold = 50

[brightness]
enable_ddcutil = true

    [brightness.monitor.DP-1]
    backend = "ddcutil"

[calendar]

[control_center]
hidden_tabs = [ "bluetooth", "weather" ]

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "dark_mode"

[default_session]
command = "/usr/bin/noctalia-greeter-session"
user = "greeter"

[hooks]
logging_out = "gsettings set org.gnome.desktop.interface color-scheme $([ \"$NOCTALIA_THEME_MODE\" = \"dark\" ] && echo prefer-dark || echo default)"
rebooting = "gsettings set org.gnome.desktop.interface color-scheme $([ \"$NOCTALIA_THEME_MODE\" = \"dark\" ] && echo prefer-dark || echo default)"
session_locked = "gsettings set org.gnome.desktop.interface color-scheme $([ \"$NOCTALIA_THEME_MODE\" = \"dark\" ] && echo prefer-dark || echo default)"
session_unlocked = "gsettings set org.gnome.desktop.interface color-scheme $([ \"$NOCTALIA_THEME_MODE\" = \"dark\" ] && echo prefer-dark || echo default)"
started = "gsettings set org.gnome.desktop.interface color-scheme $([ \"$NOCTALIA_THEME_MODE\" = \"dark\" ] && echo prefer-dark || echo default)"
theme_mode_changed = "gsettings set org.gnome.desktop.interface color-scheme $([ \"$NOCTALIA_THEME_MODE\" = \"dark\" ] && echo prefer-dark || echo default)"

[location]
custom_schedule = true
sunrise = "06:00"
sunset = "18:00"

[lockscreen]
blur_intensity = 0.99999997764825821
tint_intensity = 0.4999999888241291
transition = []

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 683.0
    cy = 649.0
    output = "DP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_night = 3600

[notification]
layer = "overlay"
max_visible = 2
position = "top_center"
scale = 0.7500000037252903

[shell]
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.launcher]
    categories = false
    category_icons_only = true
    layout = "simple"
    search_position = "top"

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    polkit_placement = "attached"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "p"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Peche"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "ghostty", "mango", "niri" ]
    community_ids = [ "opencode", "brave-origin", "zed", "steam", "fcitx5" ]
    enable_community_templates = false

[wallpaper]
directory = "/home/naul1/Pictures/saved"
transition = []

    [wallpaper.default]
    path = "/home/naul1/Pictures/saved/rin-flute.jpg"

    [wallpaper.last]
    path = "/home/naul1/Pictures/saved/rin-flute.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/naul1/Pictures/saved/rin-flute.jpg"

[weather]
enabled = false

[widget.battery]
hide_when_full = true
hide_when_plugged = true

[widget.clipboard]
enabled = false

[widget.clock]
capsule_fill = "on_secondary"
capsule_radius = "auto"
format = "{:%H:%M}  •  {:%a}  •  {:%d/%m}"

[widget.cpu]
enabled = false
visualization = "none"

[widget.launcher]
enabled = false

[widget.media]
enabled = false

[widget.network]
show_label = false

[widget.notifications]
enabled = false

[widget.ram]
display = "text"
visualization = "none"

[widget.session]
enabled = false

[widget.spacer_]
enabled = false
length = 160
type = "spacer"

[widget.taskbar]
anchor = true
capsule_radius = "auto"
group_by_workspace = true
hide_empty_workspaces = true
scale = 1.8
show_workspace_label = false
workspace_group_content = "dots"

    [widget.taskbar.actions]
    scroll_down = "exec niri msg action focus-column-right"
    scroll_up = "exec niri msg action focus-column-left"

[widget.temp]
enabled = false
visualization = "none"

[widget.tray]
drawer = true
match_adjacent_spacing = true
pinned = [ "J1XYZev7MS", "5Nae6dg9v8", "fblcSBBl-1", "GEYZ_1u2TY", "34ZWAPnnTd", "hn4tjzssac" ]

[widget.volume.actions]
right = "exec bash -c 'pactl list cards | grep -q \"Active Profile: HiFi.*Headphones\" && pactl set-card-profile alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic \"HiFi (HDMI1, HDMI2, HDMI3, Mic1, Mic2, Speaker)\" || pactl set-card-profile alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic \"HiFi (HDMI1, HDMI2, HDMI3, Headphones, Mic1, Mic2)\"'"

[widget.workspaces]
active_pill_size = 3.0
anchor = true
enabled = false
hide_when_empty = true
